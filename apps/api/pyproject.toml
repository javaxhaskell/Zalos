[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge — finance-team-facing app for authoring and repairing Python finance agents."
readme = "../../README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "AgentForge" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-multipart>=0.0.12",
    "anthropic>=0.40.0",
    "structlog>=24.4.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return
    "PIE",   # misc
    "T20",   # print statements
    "ASYNC", # async correctness
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "T201"]
"alembic/*" = ["I001", "E402"]  # bootstrap files; sys.path insert before imports is intentional
"src/agentforge/evals/__main__.py" = ["T201"]  # CLI entry-point — print() is the user output
"scripts/run_author_blind_eval.py" = ["E402", "T201"]  # CLI bootstraps src path and prints report paths

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pandas", "openpyxl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -q -m 'not live'"
filterwarnings = ["error"]
markers = [
    "live: hits the real Anthropic API; skipped by default. Run with `pytest -m live`.",
]
